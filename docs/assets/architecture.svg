<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Playwright MCP transport architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="url(#bg)" rx="16"/>
  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="700">Playwright Test &#8594; MCP Transport &#8594; Browser</text>

  <g filter="url(#shadow)">
    <rect x="40" y="70" width="220" height="280" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <text x="150" y="100" text-anchor="middle" fill="#dcfce7" font-family="ui-monospace, monospace" font-size="14" font-weight="700">Your test suite</text>
    <text x="60" y="130" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">test('checkout', async ({ page }) => {</text>
    <text x="60" y="150" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">  await page.goto('/cart');</text>
    <text x="60" y="170" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">  await page.getByRole('button').click();</text>
    <text x="60" y="190" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">  await expect(page).toHaveURL(/thanks/);</text>
    <text x="60" y="210" fill="#bbf7d0" font-family="ui-monospace, monospace" font-size="12">});</text>
    <text x="150" y="250" text-anchor="middle" fill="#86efac" font-family="ui-sans-serif" font-size="11">unchanged spec files</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="70" width="260" height="280" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="430" y="100" text-anchor="middle" fill="#dbeafe" font-family="ui-monospace, monospace" font-size="14" font-weight="700">ShimPage / ShimLocator</text>
    <text x="320" y="130" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="11">createMcpTest(baseTest, baseExpect)</text>
    <text x="320" y="155" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="11">matchers: toBeVisible, toHaveText...</text>
    <text x="320" y="175" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="11">route(), waitForEvent(), mouse</text>
    <text x="320" y="195" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="11">browser_run_code_unsafe bridge</text>
    <text x="320" y="215" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="11">transient DOM capture (MutationObserver)</text>
    <text x="430" y="255" text-anchor="middle" fill="#93c5fd" font-family="ui-sans-serif" font-size="11">Playwright-shaped API</text>
    <text x="430" y="275" text-anchor="middle" fill="#93c5fd" font-family="ui-sans-serif" font-size="11">over serialized MCP tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="70" width="150" height="120" rx="14" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/>
    <text x="675" y="100" text-anchor="middle" fill="#ede9fe" font-family="ui-monospace, monospace" font-size="13" font-weight="700">@playwright/mcp</text>
    <text x="675" y="125" text-anchor="middle" fill="#ddd6fe" font-family="ui-monospace, monospace" font-size="11">stdio / HTTP</text>
    <text x="675" y="145" text-anchor="middle" fill="#ddd6fe" font-family="ui-monospace, monospace" font-size="11">browser_navigate</text>
    <text x="675" y="165" text-anchor="middle" fill="#ddd6fe" font-family="ui-monospace, monospace" font-size="11">browser_click ...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="70" width="140" height="120" rx="14" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
    <text x="850" y="105" text-anchor="middle" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="13" font-weight="700">Chrome</text>
    <text x="850" y="130" text-anchor="middle" fill="#fed7aa" font-family="ui-sans-serif" font-size="11">headless / headed</text>
    <text x="850" y="150" text-anchor="middle" fill="#fed7aa" font-family="ui-sans-serif" font-size="11">isolated profile</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="600" y="220" width="320" height="130" rx="14" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="760" y="250" text-anchor="middle" fill="#f1f5f9" font-family="ui-sans-serif" font-size="13" font-weight="700">Wild validation (5 OSS repos)</text>
    <text x="620" y="278" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">SvelteKit 960 pass  Cal.com pass  Astro ~98%</text>
    <text x="620" y="298" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="11">Qwik 197/251  Nuxt 13/17 rep.</text>
    <text x="620" y="318" fill="#94a3b8" font-family="ui-sans-serif" font-size="10">real suites, one-line mcp-test.ts swap</text>
  </g>

  <line x1="260" y1="210" x2="300" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="150" x2="600" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="750" y1="130" x2="780" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="350" x2="680" y2="285" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
</svg>
